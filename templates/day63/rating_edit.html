<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Rating</title>
</head>
<body>
    <form action="{{ url_for('edit_rating') }}", method="POST">
        <h2>Book Name: {{ book['title'] }}</h2>
        <h3>Current Rating: {{ book['rating'] }}</h3>
        <input hidden="hidden" name="id" value="{{book.id}}" />
        <input type="text" name="new_rating">
        <button type="Submit">Change Rating</button>
    </form>
</body>
</html>
